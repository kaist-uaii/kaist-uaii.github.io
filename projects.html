<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects | UAII - Urban AI Institute</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets_new/css/style.css">
  <link rel="stylesheet" href="assets_new/css/hero.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    html, body {
      overflow-x: hidden;
      overflow-y: auto;
      height: auto;
      background: #f8fafc;
      color: #1e293b;
      font-family: 'Inter', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
    }

    .page-scroll {
      position: relative;
      z-index: 1;
      min-height: 100vh;
    }

    /* Accordion body */
    .theme-accordion-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease;
    }
    .theme-accordion.expanded .theme-accordion-body {
      max-height: 5000px;
    }
    .theme-chevron {
      transition: transform 0.3s ease;
    }
    .theme-accordion.expanded .theme-chevron {
      transform: rotate(180deg);
    }

    /* Pipeline dots */
    .pipeline-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #2563eb;
      box-shadow: 0 0 0 4px #dbeafe, 0 2px 8px rgba(37,99,235,0.2);
      flex-shrink: 0;
    }
    .pipeline-connector {
      flex: 1;
      height: 2px;
      background: linear-gradient(90deg, #93c5fd, #3b82f6);
      margin-top: 9px;
      min-width: 8px;
    }

    @media (max-width: 640px) {
      .pipeline-steps-wrap {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 0;
      }
      .pipeline-steps-wrap .pipeline-steps {
        width: 100%;
      }
      .pipeline-step-name {
        font-size: 0.65rem;
      }
      .pipeline-dot {
        width: 12px;
        height: 12px;
      }
      .pipeline-connector {
        margin-top: 5px;
        min-width: 4px;
      }
      .meta-grid-mobile {
        grid-template-columns: 1fr !important;
      }
    }


    /* Entrance animations */
    .fade-up {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    .fade-up.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .fade-up-d1 { transition-delay: 0.08s; }
    .fade-up-d2 { transition-delay: 0.16s; }
    .fade-up-d3 { transition-delay: 0.24s; }
    .fade-up-d4 { transition-delay: 0.36s; }

  </style>
</head>
<body>

  <!-- Navigation -->
  <div id="navbar" data-page="Projects"></div>

  <div class="page-scroll">

    <!-- Hero -->
    <div class="page-hero">
      <p class="page-hero-eyebrow fade-up">KAIST · Urban AI Institute</p>
      <h1 class="page-hero-title fade-up fade-up-d1">Projects</h1>
      <p class="page-hero-sub fade-up fade-up-d2"></p>
    </div>

    <!-- Themes -->
    <div class="max-w-6xl mx-auto px-6 pb-20 flex flex-col gap-6">

      <!-- Dr.City -->
      <div class="theme-accordion bg-white border border-slate-200 rounded-xl overflow-hidden hover:shadow-lg fade-up" id="drcity">
        <div class="flex items-center justify-between px-6 sm:px-8 py-6 border-b border-slate-200 cursor-pointer select-none hover:bg-slate-50 transition-colors" onclick="toggleAccordion(this)">
          <div class="flex items-baseline gap-3">
              <span class="text-xl sm:text-2xl font-extrabold text-blue-900 tracking-tight">Dr.City</span>
              <span class="text-[0.6rem] sm:text-xs uppercase tracking-[0.25em] font-semibold text-slate-400">Future of Cities</span>
            </div>
          <svg class="theme-chevron w-6 h-6 text-slate-400 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="theme-accordion-body">
          <div class="px-6 sm:px-8 pt-10 pb-12 overflow-x-hidden max-w-full">
            <!-- Pipeline — desktop: horizontal, mobile: vertical -->
            <!-- Pipeline: Slate→Blue gradient dot (larger) -->
            <div class="hidden sm:flex items-start gap-0 mb-8">
              <div class="flex flex-col items-center flex-1 min-w-0"><div class="w-5 h-5 rounded-full bg-gradient-to-br from-slate-400 to-blue-700 shadow-lg"></div><span class="mt-2 text-sm font-bold text-blue-900 text-center">Sense</span></div>
              <div class="pipeline-connector"></div>
              <div class="flex flex-col items-center flex-1 min-w-0"><div class="w-5 h-5 rounded-full bg-gradient-to-br from-slate-400 to-blue-700 shadow-lg"></div><span class="mt-2 text-sm font-bold text-blue-900 text-center">Diagnose</span></div>
              <div class="pipeline-connector"></div>
              <div class="flex flex-col items-center flex-1 min-w-0"><div class="w-5 h-5 rounded-full bg-gradient-to-br from-slate-400 to-blue-700 shadow-lg"></div><span class="mt-2 text-sm font-bold text-blue-900 text-center">Intervene</span></div>
              <div class="pipeline-connector"></div>
              <div class="flex flex-col items-center flex-1 min-w-0"><div class="w-5 h-5 rounded-full bg-gradient-to-br from-slate-400 to-blue-700 shadow-lg"></div><span class="mt-2 text-sm font-bold text-blue-900 text-center">Promote</span></div>
              <div class="pipeline-connector"></div>
              <div class="flex flex-col items-center flex-1 min-w-0"><div class="w-5 h-5 rounded-full bg-gradient-to-br from-slate-400 to-blue-700 shadow-lg"></div><span class="mt-2 text-sm font-bold text-blue-900 text-center">Grow</span></div>
            </div>

            <!-- Mobile vertical (unchanged) -->
            <div class="sm:hidden relative pl-6 mb-8">
              <div class="absolute left-[7px] top-[8px] bottom-[8px] w-0.5 bg-gradient-to-b from-blue-300 to-blue-500"></div>
              <div class="flex items-center gap-3 py-2"><div class="w-4 h-4 rounded-full bg-gradient-to-br from-slate-400 to-blue-700 shadow-lg absolute left-0"></div><span class="text-xs font-bold text-blue-900">Sense</span></div>
              <div class="flex items-center gap-3 py-2"><div class="w-4 h-4 rounded-full bg-gradient-to-br from-slate-400 to-blue-700 shadow-lg absolute left-0"></div><span class="text-xs font-bold text-blue-900">Diagnose</span></div>
              <div class="flex items-center gap-3 py-2"><div class="w-4 h-4 rounded-full bg-gradient-to-br from-slate-400 to-blue-700 shadow-lg absolute left-0"></div><span class="text-xs font-bold text-blue-900">Intervene</span></div>
              <div class="flex items-center gap-3 py-2"><div class="w-4 h-4 rounded-full bg-gradient-to-br from-slate-400 to-blue-700 shadow-lg absolute left-0"></div><span class="text-xs font-bold text-blue-900">Promote</span></div>
              <div class="flex items-center gap-3 py-2"><div class="w-4 h-4 rounded-full bg-gradient-to-br from-slate-400 to-blue-700 shadow-lg absolute left-0"></div><span class="text-xs font-bold text-blue-900">Grow</span></div>
            </div>

            <!-- Research Groups (dynamic from JSON) -->
            <div id="drcity-projects"></div>

          </div>
        </div>
      </div>

      <!-- CityFWD.ai -->
      <div class="theme-accordion bg-white border border-slate-200 rounded-xl overflow-hidden hover:shadow-lg fade-up" id="cityfwd">
        <div class="flex items-center justify-between px-6 sm:px-8 py-6 border-b border-slate-200 cursor-pointer select-none hover:bg-slate-50 transition-colors" onclick="toggleAccordion(this)">
          <div class="flex items-baseline gap-3">
              <span class="text-xl sm:text-2xl font-extrabold text-blue-900 tracking-tight">CityFWD.ai</span>
              <span class="text-[0.6rem] sm:text-xs uppercase tracking-[0.25em] font-semibold text-slate-400">Cities of Future</span>
            </div>
          <svg class="theme-chevron w-6 h-6 text-slate-400 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="theme-accordion-body">
          <div class="px-6 sm:px-8 pt-10 pb-12 overflow-x-hidden max-w-full">

            <!-- Pipeline — desktop: horizontal, mobile: vertical -->
            <div class="hidden sm:flex items-start gap-0 mb-8">
              <div class="flex flex-col items-center flex-1 min-w-0"><div class="w-5 h-5 rounded-full bg-gradient-to-br from-slate-400 to-blue-700 shadow-lg"></div><span class="mt-2 text-sm font-bold text-blue-900 text-center">Plan</span></div>
              <div class="pipeline-connector"></div>
              <div class="flex flex-col items-center flex-1 min-w-0"><div class="w-5 h-5 rounded-full bg-gradient-to-br from-slate-400 to-blue-700 shadow-lg"></div><span class="mt-2 text-sm font-bold text-blue-900 text-center">Design</span></div>
              <div class="pipeline-connector"></div>
              <div class="flex flex-col items-center flex-1 min-w-0"><div class="w-5 h-5 rounded-full bg-gradient-to-br from-slate-400 to-blue-700 shadow-lg"></div><span class="mt-2 text-sm font-bold text-blue-900 text-center">Build</span></div>
              <div class="pipeline-connector"></div>
              <div class="flex flex-col items-center flex-1 min-w-0"><div class="w-5 h-5 rounded-full bg-gradient-to-br from-slate-400 to-blue-700 shadow-lg"></div><span class="mt-2 text-sm font-bold text-blue-900 text-center">Operate</span></div>
              <div class="pipeline-connector"></div>
              <div class="flex flex-col items-center flex-1 min-w-0"><div class="w-5 h-5 rounded-full bg-gradient-to-br from-slate-400 to-blue-700 shadow-lg"></div><span class="mt-2 text-sm font-bold text-blue-900 text-center">Interact</span></div>
              <div class="pipeline-connector"></div>
              <div class="flex flex-col items-center flex-1 min-w-0"><div class="w-5 h-5 rounded-full bg-gradient-to-br from-slate-400 to-blue-700 shadow-lg"></div><span class="mt-2 text-sm font-bold text-blue-900 text-center">Reimagine</span></div>
            </div>
            <div class="sm:hidden relative pl-6 mb-8">
              <div class="absolute left-[7px] top-[8px] bottom-[8px] w-0.5 bg-gradient-to-b from-blue-300 to-blue-500"></div>
              <div class="flex items-center gap-3 py-2"><div class="w-4 h-4 rounded-full bg-gradient-to-br from-slate-400 to-blue-700 shadow-lg absolute left-0"></div><span class="text-xs font-bold text-blue-900">Plan</span></div>
              <div class="flex items-center gap-3 py-2"><div class="w-4 h-4 rounded-full bg-gradient-to-br from-slate-400 to-blue-700 shadow-lg absolute left-0"></div><span class="text-xs font-bold text-blue-900">Design</span></div>
              <div class="flex items-center gap-3 py-2"><div class="w-4 h-4 rounded-full bg-gradient-to-br from-slate-400 to-blue-700 shadow-lg absolute left-0"></div><span class="text-xs font-bold text-blue-900">Build</span></div>
              <div class="flex items-center gap-3 py-2"><div class="w-4 h-4 rounded-full bg-gradient-to-br from-slate-400 to-blue-700 shadow-lg absolute left-0"></div><span class="text-xs font-bold text-blue-900">Operate</span></div>
              <div class="flex items-center gap-3 py-2"><div class="w-4 h-4 rounded-full bg-gradient-to-br from-slate-400 to-blue-700 shadow-lg absolute left-0"></div><span class="text-xs font-bold text-blue-900">Interact</span></div>
              <div class="flex items-center gap-3 py-2"><div class="w-4 h-4 rounded-full bg-gradient-to-br from-slate-400 to-blue-700 shadow-lg absolute left-0"></div><span class="text-xs font-bold text-blue-900">Reimagine</span></div>
            </div>

            <!-- Research Groups (dynamic from JSON) -->
            <div id="cityfwd-projects"></div>

          </div>
        </div>
      </div>

    </div>

  </div>

  <script>
  function toggleAccordion(header) {
    var accordion = header.parentElement;
    accordion.classList.toggle('expanded');
  }

  // Auto-expand from URL hash
  (function() {
    var hash = window.location.hash.replace('#', '');
    if (hash) {
      var el = document.getElementById(hash);
      if (el && el.classList.contains('theme-accordion')) {
        el.classList.add('expanded');
        setTimeout(function() {
          var navHeight = 56;
          var top = el.getBoundingClientRect().top + window.pageYOffset - navHeight - 40;
          window.scrollTo({ top: top, behavior: 'smooth' });
        }, 100);
      }
    }
  })();

  // Load project cards from JSON
  (async function() {
    var res = await fetch('data/projectsData.json');
    var text = await res.text();
    var clean = text.charCodeAt(0) === 0xFEFF ? text.slice(1) : text;
    var projects = JSON.parse(clean);

    function renderCard(p) {
      var img = p.image ? '<div class="w-16 h-16 sm:w-20 sm:h-20 flex items-center justify-center bg-white rounded-lg border border-slate-200 p-2 flex-shrink-0"><img class="w-full h-full object-contain" src="' + p.image.replace(/^\//, '') + '" alt="' + p.title + '"></div>' : '';
      var period = p.startYear ? (p.endYear ? (p.startYear === p.endYear ? '' + p.startYear : p.startYear + '–' + p.endYear) : p.startYear + '–Present') : '—';

      var sponsor = p.sponsor || '—';
      return '<a class="grid grid-cols-[64px_1fr] sm:grid-cols-[80px_1fr] items-start gap-4 p-5 border border-slate-200 rounded-xl bg-slate-50 hover:bg-blue-50 hover:border-blue-300 hover:-translate-y-0.5 transition-all no-underline mb-3" href="' + (p.link || '#') + '" target="_blank" rel="noopener">'
        + img
        + '<div class="flex flex-col gap-1 flex-1 min-w-0">'
        + '<span class="text-base sm:text-lg font-bold text-slate-900">' + p.fullname + (p.title ? ' <span class="text-slate-300 font-normal mx-1">|</span> <span class="text-slate-400 font-normal">' + p.title + '</span>' : '') + '</span>'
        
        + '<div class="grid grid-cols-2 max-sm:grid-cols-1 gap-2 mt-2">'
        + '<div class="bg-white border border-slate-200 rounded-lg p-2 text-center"><div class="text-[0.6rem] font-bold uppercase tracking-wider text-slate-400 mb-1">Period</div><div class="text-sm font-bold text-blue-900">' + period + '</div></div>'
        + '<div class="bg-white border border-slate-200 rounded-lg p-2 text-center"><div class="text-[0.6rem] font-bold uppercase tracking-wider text-slate-400 mb-1">Sponsor</div><div class="text-sm font-bold text-blue-900">' + sponsor + '</div></div>'
        + '</div></div></a>';
    }

    var drcityEl = document.getElementById('drcity-projects');
    var cityfwdEl = document.getElementById('cityfwd-projects');

    projects.forEach(function(p) {
      if (p.theme === 'drcity') {
        drcityEl.innerHTML += renderCard(p);
      } else if (p.theme === 'cityfwd') {
        cityfwdEl.innerHTML += renderCard(p);
      }
    });
  })();

  // Entrance animations
  (function() {
    var fadeEls = document.querySelectorAll('.fade-up');
    var fadeObs = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, { threshold: 0.15 });
    fadeEls.forEach(function(el) { fadeObs.observe(el); });
  })();
  </script>

  <script src="partials/navbar.js"></script>
</body>
</html>
